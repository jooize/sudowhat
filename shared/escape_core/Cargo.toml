[package]
name = "escape_core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Anti-spoofing escape/quote/command-line core for sudowhat (C ABI staticlib)"

# staticlib: the macOS audit bundle (an ObjC shell) links this .a directly; the
# same crate is the Phase-2 Linux plugin's core. No external dependencies, so
# the build needs no registry access and is reproducible offline.
[lib]
name = "escape_core"
crate-type = ["staticlib"]

# panic = "abort": a panic must never unwind across the C ABI (that is UB). The
# code below is written to be panic-free; abort is the hard backstop. Set on
# release only — the shipped staticlib is built with `cargo build --release`.
# (The dev/test profile keeps unwinding so the in-crate `cargo test` harness,
# which needs it to catch panics, still works.)
[profile.release]
panic = "abort"
opt-level = 2
